<div
  class="{{ if eq .Type "docs" }}
    bg-secondary-bg
  {{ else }}
    bg-primary-bg
  {{ end }} prose sticky top-16 z-10 hidden px-6 py-4 lg:block"
>
  <h3>{{ i18n "onThisPage" }}</h3>
</div>
<div
  class="sticky-toc {{ if eq .Type "docs" }}
    border-s
  {{ end }}{{ if .Params.tocUnordered }} toc-unordered{{ end }} hidden px-6 pb-6 lg:block"
>
  {{ .TableOfContents }}
</div>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    enableStickyToc();
    if (typeof renderMathInElement === "function") {
      document.querySelectorAll(".sticky-toc a").forEach(a => {
        renderMathInElement(a, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false },
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true }
          ]
        });
      });
    }
  });
</script>
